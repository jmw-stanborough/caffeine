[package]
name = "caffeine"
version = "0.1.0"
description = "A utility application to assist with network management"
authors = ["JMWalters"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "caffeine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Caffeine"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
winping = "0.1"
rusqlite = { version = "0.33", features = ["bundled"] }
url = "2"
sysinfo = "0.39.6"
portable-pty = "0.9.0"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query", "ws"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
